name: Publicar carrossel do dia

on:
  schedule:
    # O agendador do GitHub e impreciso: em horario de pico medimos atrasos de
    # 50 a 70 minutos. Duas defesas contra isso:
    #
    #   1. Agendamos CEDO (03:37 BRT) e o script espera ate as 05:00 para
    #      publicar (--aguardar-ate). Assim o atraso do cron e absorvido e o
    #      post sai no horario certo.
    #   2. Dois horarios de reforco, caso o primeiro atrase demais ou falhe.
    #      A trava anti-duplicidade (logs/publicados.csv) impede post repetido.
    #
    # A folga de 83 min foi dimensionada acima do pior atraso ja medido (72 min
    # em 03/08). Horarios mais cedo em UTC tambem pegam fila menor, e os
    # minutos "quebrados" evitam a hora cheia, que e a mais disputada.
    - cron: "37 6 * * *"   # 03:37 BRT - principal, espera ate 05:00 (folga 83 min)
    - cron: "7 7 * * *"    # 04:07 BRT - reforco 1 (folga 53 min)
    - cron: "37 7 * * *"   # 04:37 BRT - reforco 2 (folga 23 min)

  # Permite disparar manualmente pela aba Actions (util para testes e para
  # republicar um dia que falhou). Execucao manual publica na hora, sem espera.
  workflow_dispatch:
    inputs:
      data:
        description: "Data a publicar (YYYY-MM-DD). Vazio = hoje."
        required: false
        type: string
      dry_run:
        description: "Apenas validar, sem publicar"
        required: false
        type: boolean
        default: true
      forcar:
        description: "Publicar mesmo se a data ja constar no log"
        required: false
        type: boolean
        default: false

# Necessario para gravar de volta o logs/publicados.csv
permissions:
  contents: write

# Impede duas execucoes simultaneas publicarem o mesmo post
concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Generoso porque a execucao principal fica ate ~83 min aguardando as
    # 05:00. Repositorio publico tem minutos de Actions ilimitados.
    timeout-minutes: 120

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Passados por env (e nao interpolados direto no shell) para que um
          # valor com caracteres especiais nao vire comando.
          IN_DATA: ${{ inputs.data }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_FORCAR: ${{ inputs.forcar }}
          EVENTO: ${{ github.event_name }}
        run: |
          ARGS=()
          if [ -n "$IN_DATA" ]; then ARGS+=(--data "$IN_DATA"); fi
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$IN_FORCAR" = "true" ]; then ARGS+=(--forcar); fi
          # So o cron espera pelo horario. Execucao manual publica na hora.
          if [ "$EVENTO" = "schedule" ]; then ARGS+=(--aguardar-ate "05:00"); fi
          echo "Executando: publicar_carrossel.py ${ARGS[*]}"
          python execution/publicar_carrossel.py "${ARGS[@]}"

      - name: Registrar publicacao no repositorio
        if: success() && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain logs/)" ]; then
            echo "Nada novo para registrar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/
          git commit -m "log: publicacao de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          # Outra execucao pode ter gravado antes; rebase evita conflito
          git pull --rebase --autostash
          git push
